{% extends "base.html" %}
{% block content %}
<section>
  <div class="row between">
    <h1>{% if person_id %}人员详情{% else %}新建人员{% endif %}</h1>
    <a class="btn secondary" href="/admin">返回列表</a>
  </div>

  <form id="personForm" class="card-form wide">
    <label>手机 <input name="phone" id="phone" required {% if person_id %}readonly{% endif %} /></label>
    <label>姓名 <input name="name" id="name" required /></label>
    <label>所在城市 <input name="city" id="city" /></label>
    <label>学院 <input name="college" id="college" /></label>
    <label>学历 <input name="education" id="education" /></label>
    <label>入学年份 <input name="enroll_year" id="enroll_year" /></label>
    <label>票种 <input name="ticket_type" id="ticket_type" /></label>
    <label>报名状态 <input name="signup_status" id="signup_status" /></label>
    <label>身份识别照片 URL <input name="photo_url" id="photo_url" /></label>
    {% if person_id %}
    <label>识别开关
      <select id="status">
        <option value="active">启用识别</option>
        <option value="disabled">停用识别</option>
      </select>
    </label>
    <p id="faceStatusLine" class="muted"></p>
    {% endif %}
    <button class="btn" type="submit">{% if person_id %}保存{% else %}创建{% endif %}</button>
  </form>

  {% if person_id %}
  <hr />
  <h2>人脸样本</h2>
  <p class="muted">本地上传单人正脸；服务端会做质量校验。每人最多 5 张启用样本。</p>
  <input type="file" id="faceFile" accept="image/*" />
  <button class="btn" id="btnUpload" type="button">上传人脸</button>
  <p id="uploadMsg" class="msg"></p>
  <div id="samples" class="samples"></div>
  {% endif %}
</section>
<script src="/static/admin.js"></script>
<script>
  AdminPerson.init({{ person_id if person_id is not none else 'null' }});
</script>
{% endblock %}
